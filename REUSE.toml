# Licensing of the repository, following https://reuse.software
# When several annotations match a file, the last one wins,
# so the general rules come first and the exceptions after them.
version = 1

# The content of the website: texts of the pages and presentations.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Kazimierz Pogoda / Xemantic"
SPDX-License-Identifier = "CC-BY-4.0"

# The code: the renderer, the build, and the styles and scripts of the pages.
[[annotations]]
path = [
    "src/**",
    "**/*.kts",
    "gradle.properties",
    "gradle/**",
    "gradlew",
    "gradlew.bat",
    ".github/**",
    ".idea/**",
    ".gitignore",
    "CNAME",
    "Gemfile",
    "Gemfile.lock",
    "_config.yml",
    "_includes/**",
    "_layouts/**",
    "_plugins/**",
    "**/*.js",
    "**/*.css"
]
SPDX-FileCopyrightText = "Kazimierz Pogoda / Xemantic"
SPDX-License-Identifier = "Apache-2.0"

# Images and documents: photos of people, works of other artists,
# and the Xemantic logo, which is a trademark.
[[annotations]]
path = [
    "**/*.jpg",
    "**/*.JPG",
    "**/*.jpeg",
    "**/*.png",
    "**/*.webp",
    "**/*.gif",
    "**/*.svg",
    "**/*.ico",
    "**/*.pdf"
]
SPDX-FileCopyrightText = "Kazimierz Pogoda / Xemantic and the respective authors"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# Archived websites of other authors, hosted on xemantic.com.
[[annotations]]
path = [
    "marchewa/**",
    "pacyfka/**",
    "stachura/**",
    "tatry-w-poezji/**"
]
SPDX-FileCopyrightText = "The respective authors"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# The legacy website, built on a third-party theme.
[[annotations]]
path = "old/**"
SPDX-FileCopyrightText = "Kazimierz Pogoda / Xemantic and the respective authors"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

[[annotations]]
path = "gradle/wrapper/gradle-wrapper.jar"
SPDX-FileCopyrightText = "Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "assets/fonts/Lazenby*"
SPDX-FileCopyrightText = "2014 Andrew Young, Disaster Fonts"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
